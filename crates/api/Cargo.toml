[package]
name = "api"
version = "2.0.0"
edition = "2021"

[dependencies]
platform-traits = { path = "../platform/traits" }
platform-windows = { path = "../platform/windows" }
core-types = { path = "../core" }
storage = { path = "../storage" }
scanner = { path = "../scanner" }
tokio = { version = "1.0", features = ["rt", "io-util", "net", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
config-mgr = { path = "../config" }
tantivy = "0.22"

