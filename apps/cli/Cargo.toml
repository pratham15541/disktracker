[package]
name = "disktracker"
version = "2.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
platform-traits = { path = "../../crates/platform/traits" }
platform-windows = { path = "../../crates/platform/windows" }
core-types = { path = "../../crates/core" }
api = { path = "../../crates/api" }
storage = { path = "../../crates/storage" }
config-mgr = { path = "../../crates/config" }
chrono = "0.4"
agent = { path = "../../crates/agent" }
rand = "0.8"
termimad = "0.31"
reqwest = { version = "0.12", features = ["json"] }



