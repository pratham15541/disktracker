[workspace]
resolver = "2"
members = [
    "apps/cli",
    "crates/core",
    "crates/config",
    "crates/api",
    "crates/platform/traits",
    "crates/platform/windows",
    "crates/scanner",
    "crates/pipeline",
    "crates/storage",
    "crates/telemetry",
    "crates/common",
    "crates/agent",
]
[workspace.metadata.release]
publish = false
pre-release-hook = ["node", "-e", "const path = require('path'); const root = require('child_process').execSync('git rev-parse --show-toplevel').toString().trim(); require(path.join(root, 'scripts/update-versions.js'));"]
shared-version = true
tag-name = "v{{version}}"

[patch.crates-io]
rust-langgraph = { path = "crates/rust-langgraph" }
