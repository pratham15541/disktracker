[workspace]
resolver = "2"
members = [
    "apps/cli",
    "crates/core",
    "crates/config",
    "crates/api",
    "crates/platform/traits",
    "crates/platform/windows",
    "crates/scanner",
    "crates/pipeline",
    "crates/storage",
    "crates/telemetry",
    "crates/common",
    "crates/agent",
]
[workspace.metadata.release]
pre-release-hook = ["node", "scripts/update-versions.js"]
shared-version = true
tag-name = "v{{version}}"

[patch.crates-io]
rust-langgraph = { path = "crates/rust-langgraph" }
